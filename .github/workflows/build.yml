name: EAS Build

on:
  pull_request:
    branches: [main, staging, feat/expo-practice]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: 'Build profile (overrides branch)'
        required: false
        type: choice
        options:
          - development
          - preview
          - production

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  determine-profile:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.set-profile.outputs.profile }}
    steps:
      - id: set-profile
        shell: bash
        run: |
          # Manual override
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.profile }}" != "" ]; then
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          BRANCH="${GITHUB_REF#refs/heads/}"

          # Production
          if [[ "$BRANCH" == "production/" ]]; then
            echo "profile=production" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Staging / Release branches
          if [[ "$BRANCH" == release/* ]]; then
            echo "profile=preview" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Development branches
          if [[ "$BRANCH" == development/* ]]; then
            echo "profile=development" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Fallback
          echo "profile=development" >> $GITHUB_OUTPUT

  build-android:
    name: EAS Build Android (${{ needs.determine-profile.outputs.profile }})
    runs-on: macos-26
    needs: determine-profile
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'android' ||
      inputs.platform == 'all'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/eas-build
        with:
          profile: ${{ needs.determine-profile.outputs.profile }}
          platform: android
          expo_token: ${{ env.EXPO_TOKEN }}

      - name: Save Android build link
        run: echo "ANDROID_BUILD_URL=https://expo.dev/accounts/${{ github.repository_owner }}/projects/movie-ticket-booking/builds" >> $GITHUB_ENV

  build-ios:
    name: EAS Build iOS (${{ needs.determine-profile.outputs.profile }})
    runs-on: macos-26
    needs: determine-profile
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'ios' ||
      inputs.platform == 'all'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/eas-build
        with:
          profile: ${{ needs.determine-profile.outputs.profile }}
          platform: ios
          expo_token: ${{ env.EXPO_TOKEN }}

      - name: Save iOS build link
        run: echo "IOS_BUILD_URL=https://expo.dev/accounts/${{ github.repository_owner }}/projects/movie-ticket-booking/builds" >> $GITHUB_ENV

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()
    steps:
      - name: Write summary
        run: |
          PROFILE="${{ needs.determine-profile.outputs.profile }}"
          echo "## ✅ Build Summary ($PROFILE)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🤖 Android: ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 iOS: ${{ needs.build-ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 View builds: https://expo.dev/accounts/${{ github.repository_owner }}/projects/movie-ticket-booking/builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Profile: $PROFILE*" >> $GITHUB_STEP_SUMMARY
