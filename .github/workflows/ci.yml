name: CI

on:
  pull_request:
    branches: [main, staging, feat/expo-practice]
    types: [opened, synchronize, reopened]

jobs:
  # Job 1: Code quality checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run ESLint
        run: pnpm lint

      - name: Check Prettier formatting
        run: pnpm format --check

      - name: TypeScript type check
        run: npx tsc --noEmit --skipLibCheck

  # Job 2: Run tests with coverage
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | grep -o '"lines":{"total":[0-9.]*,"covered":[0-9.]*,"skipped":[0-9.]*,"pct":[0-9.]*' | grep -o '"pct":[0-9.]*' | cut -d':' -f2)
          echo "Current coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage is below 80% threshold"
            exit 1
          fi
        continue-on-error: true

  # Job 3: Build validation
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Setup Expo CLI
        run: pnpm add -g eas-cli

      - name: Validate EAS configuration
        run: |
          if [ -f "eas.json" ]; then
            echo "EAS configuration found"
            cat eas.json
          else
            echo "EAS configuration not found"
            exit 1
          fi

      - name: Check app.json configuration
        run: |
          if [ -f "app.json" ]; then
            echo "app.json found"
            node -e "const config = require('./app.json'); console.log('App name:', config.expo.name); console.log('Version:', config.expo.version);"
          else
            echo "app.json not found"
            exit 1
          fi

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [code-quality, test, build-validation]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build-validation.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed successfully!"

      - name: Success message
        run: |
          echo "✅ Code quality checks passed"
          echo "✅ All tests passed"
          echo "✅ Build validation successful"
          echo "🎉 CI pipeline completed successfully!"
