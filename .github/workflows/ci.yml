name: CI — Build & Quality Checks

on:
  push:
    branches:
      - main
      - feat/ticket-reservation
  pull_request:
    branches:
      - main
      - feat/ticket-reservation

jobs:
  quality:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:check

  security:
    name: Verify Package Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Audit dependencies
        run: |
          if ! pnpm audit --audit-level high; then
            echo "::warning::Security vulnerabilities found in dependencies. Please review and update affected packages."
            exit 0
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Build
        run: pnpm build

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: ./.github/actions/setup-docker
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/ticket-reservation
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,scope=${{ github.ref_name }},mode=max
