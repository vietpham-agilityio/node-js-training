# Auto-merged over docker-compose.yml by `docker compose up` whenever no -f flag is passed
# (Docker Compose's standard local-dev overlay convention). Switches every service to the
# Dockerfile's `dev` target and bind-mounts source for live-reload via `nest start --watch`.
# Explicit `docker compose -f docker-compose.yml ...` invocations (prod) skip this file entirely.
services:
  order:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json

  inventory:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json

  auth:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json

  user:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json

  product:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json

  api-gateway:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
